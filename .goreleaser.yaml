# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: hotstack

before:
  hooks:
    - go mod tidy

builds:
  - id: hotstack
    binary: hotstack
    main: ./cli/hotstack
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/abraa/hotstack/internal/cli.version={{.Version}}
      - -X github.com/abraa/hotstack/internal/cli.commit={{.ShortCommit}}

archives:
  - id: hotstack
    builds:
      - hotstack
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: abraa
    name: hotstack
  draft: false
  prerelease: auto
